syntax = "proto3";

option csharp_namespace = "Presentation.Grpc";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service ProductGrpc{
    rpc CreateProduct (CreateProductGrpcRequest) returns (CreateProductGrpcResponse){
        option (google.api.http) = {
            post: "/v1/grpc/product"
            body: "*"
        };
    }

    rpc GetProduct (GetProductGrpcRequest) returns (GetProductGrpcResponse){
        option (google.api.http) = {
            get: "/v1/grpc/product/{id}"
        };
    }

    rpc GetFilteredProducts (GetFilteredProductsGrpcRequest) returns (GetFilteredProductsGrpcResponse){
        option (google.api.http) = {
            get: "/v1/grpc/filtered_products"
        };
    }
}


enum GrpcProductType{
    GENERAL = 0;
    CHEMICALS = 1;
    TECH = 2;
    GROCERIES = 3;
}

message CreateProductGrpcRequest{
    string name = 1;
    double price = 2;
    double weight = 3;
    GrpcProductType type = 4;
    int32 warehouse_num = 5;
}

message CreateProductGrpcResponse{
    int64 id = 1;
}

message GetProductGrpcRequest{
    int64 id = 1;
}

message GetProductGrpcResponse{
    int64 id = 1;
    string name = 2;
    double price = 3;
    double weight = 4;
    GrpcProductType type = 5;
    google.protobuf.Timestamp created_at = 6;
    int32 warehouse_num = 7;
}

message GetFilteredProductsGrpcRequest{
    optional GrpcProductType type = 1;
    optional google.protobuf.Timestamp created_at = 2;
    optional int32 warehouse_num = 3;
    int32 offset = 4;
    int32 limit = 5;
}

message GetFilteredProductsGrpcResponse{
    repeated GetProductGrpcResponse filtered_products = 1;
}


